# ── RSS / Atom feed subscribers (cycle 8) ────────────────────────────────────
# Outlets identified as feed-capable in cycle 4's preflight, ranked by churn
# (headlines per 5 min). FeedWatcher fetches the feed via the scraper's
# /feed endpoint instead of running Playwright on the homepage — typical
# fetch is ~50 ms instead of 3–10 s. The companion HTML entries above have
# NOT been removed for these domains, intentionally — the feed often
# surfaces section headlines while the homepage shows above-the-fold
# bigger stories. Both have their own dedup so we don't double-emit.
feeds:
  - site_url: "https://www.timesofisrael.com/"
    feed_url: "https://www.timesofisrael.com/feed/"
    interval_seconds: 60

  - site_url: "https://www.thehindu.com/news/"
    feed_url: "https://www.thehindu.com/news/feeder/default.rss"
    interval_seconds: 90

  - site_url: "https://www.aljazeera.com/news/"
    feed_url: "https://www.aljazeera.com/xml/rss/all.xml"
    interval_seconds: 90

# ── Social accounts to monitor (Twitter/X and Truth Social) ──────────────────
# These fire into the same headline pipeline as news sites.
# Tweets/posts are tagged source="twitter" or "truth_social" in the DB.
# Requires SEARCH_API_KEY (Brave) set in scraper's .env for Twitter.
# Truth Social uses public RSS — no key needed.
social_accounts:
  # Cycle-8: dropped Twitter watchers. Cycle 7 data: 885 twitter signals
  # produced 7 trades for +$1.43 total (noise) and consumed Brave API budget
  # continuously. Truth Social stays — it's free public RSS, no Brave cost.
  # If we re-add Twitter, we should first switch to a nitter mirror so it
  # doesn't compete with anything else for the Brave hourly cap.
  - username: "realDonaldTrump"
    platform: "truth_social"
    interval_seconds: 60

# ── Market index ─────────────────────────────────────────────────────────────
markets:
  refresh_hours: 4             # re-fetch Polymarket market list every N hours
  similarity_threshold: 0.55   # min cosine similarity to include a market match
                               # Raised from 0.35 → 0.55 after the 6h analysis:
                               # sub-0.55 matches were dominated by spurious
                               # keyword overlaps (Rick Rieder → Rick Devens,
                               # OPEC cuts demand → OPEC dissolves, etc.).
                               # Mirrors impact_tracker's MIN_SIMILARITY.
  top_k: 25                    # max markets to evaluate per headline (AI batch size)
                               # Cycle-8: raised 15 → 25 to widen the trade
                               # funnel and produce more closed trades per
                               # hour (~5/hr → ~8/hr expected). With the
                               # 0.55 similarity floor still active, the
                               # extra 10 slots only fire when there really
                               # are 25 above-threshold matches — typically
                               # only on big political stories, so the
                               # marginal token cost is bounded.
  max_tracked_markets: 20000   # cap index at top-N markets by volume (0 = no cap)
                               # 20k × ~1.5KB embedding ≈ 30MB; matching is numpy
                               # cosine over a (N, 384) matrix — sub-10ms at N=20k.
                               # A wider universe means each headline's top-15 is
                               # drawn from a much broader pool — better matches
                               # without raising per-headline LLM cost.
  min_quality_score: 0.3       # A4E.3: drop non-polymarket rows whose derived
                               # quality (liquidity / volume / days-to-resolution
                               # / spread) falls below this floor at index load.
                               # 0.0 disables. Polymarket rows are exempt.

# ── Market discovery beyond Polymarket (A4E.3, default OFF) ────────────────
# When enabled, ActiveDiscoveryLoop polls Kalshi + Predictit every
# `interval_secs`, drops rows below `min_quality`, dedups by (source, cond_id),
# upserts into the `markets` table and triggers a MarketIndex refresh.
discovery:
  enabled: false              # opt-in until live credentials verified
  interval_secs: 1800         # 30 min — Kalshi/Predictit move slower than gamma
  min_quality: 0.3
  kalshi_enabled: true
  predictit_enabled: true

# ── AI direction classifier (via OpenRouter) ─────────────────────────────────
# OpenRouter model IDs: https://openrouter.ai/models
# Good options: google/gemini-2.5-flash  (fast + cheap)
#               anthropic/claude-haiku-4-5  (reliable JSON)
#               meta-llama/llama-3.1-8b-instruct  (free tier)
ai:
  # Stage-3 prediction model. 2026-05-21 evening: REVERTED to gemini-2.5-flash
  # after the gemini-3.1-flash-lite-preview swap (06:00 UTC) produced only
  # 1 executed trade across 330,570 decisions in the same trading day.
  # Diagnostic: ~99.9% of predictions came back NEUTRAL — including 44
  # high-confidence (≥0.65) NEUTRALs labelled "neutral" by trader.evaluate.
  # The new model is dramatically more conservative than 2.5-flash under
  # the current prompt; until the prompt is tuned for it (or a backtest
  # validates a new prompt), pay the higher per-token cost rather than
  # lose trade volume.
  #
  # OpenRouter pricing reference (refresh against /v1/models):
  #   2.5-flash      : in $0.300/M  out $2.500/M  ← current
  #   3.1-flash-lite : in $0.250/M  out $1.500/M  (cheaper but too quiet)
  #   2.5-flash-lite : in $0.100/M  out $0.400/M  (used for relevance below)
  #
  # Pre-swap snapshot lives at snapshots/pre_3.1_flash_lite_swap_20260521/
  # if a future revisit needs a clean baseline DB.
  model: "google/gemini-2.5-flash"
  # Cross-vendor premium fallback. Triggered when the relevance pass marks
  # ≥2 markets STRONG_YES AND freshness=BREAKING (see relevance.py).
  premium_model: "anthropic/claude-haiku-4-5"
  premium_sim_threshold: 0.70               # legacy fallback gate
  premium_trigger_breaking_strong: true     # cycle-9 premium routing
  api_key: ""                 # leave blank → uses OPENROUTER_API_KEY env var
  api_base: "https://openrouter.ai/api/v1"
  # Ensemble (cycle 6): N parallel classifier calls at higher temperature,
  # then average distributions + majority vote. Confidence is reported as
  # mean_p_winner × agreement_fraction — so a unanimous 0.6 vote scores 0.60,
  # a 2/3 vote at mean 0.5 scores ~0.33, and a 1/1/1 tie scores 0.
  ensemble_samples: 3
  ensemble_temperature: 0.5
  # Agreement is gated separately (`min_agreement`); confidence stays on the
  # model's native probability scale so the edge model's `2·conf − 1` rescale
  # still works (it would floor to 0 if we baked agreement into confidence).
  min_agreement: 0.66         # 2-of-3 majority required for an ensemble of 3
  min_confidence: 0.35        # below this → treat as NEUTRAL, skip trade
  # A4E.4 (2026-05-23): max markets per LLM call. Smaller batches let the
  # model spend its output-token budget on per-market reasoning (including
  # the <scratch> chain-of-thought block) instead of cramming 25
  # distributions into one bounded response. Per master plan 4E.4(g).
  batch_size: 10

# ── Pre-headline market context (cycle 11) ──────────────────────────────────
# After Stage-2 culls candidates, fetch 30 min of CLOB mid-price history per
# survivor and derive 7 scalars (vol/mean/min/max/cur/drift/n) fed into the
# Stage-3 prompt + persisted on every trade row. ~70 prompt-tokens/market;
# 1-3 parallel GETs (~50-150ms added pre_ms). Disable to roll back.
market_context:
  enabled: true
  window_secs: 1800     # 30 min — token cost is window-length agnostic
  cache_ttl_secs: 30    # share fetches across variants on the same headline

# ── Stage-2 relevance gate (cycle 9) ─────────────────────────────────────────
# Cheap LLM call between embedding match (Stage 1, cosine ≥ 0.35) and
# prediction (Stage 3). Asks "is this headline meaningfully about this market"
# for each candidate; culls WEAK/NO before paying for Stage-3 reasoning.
# Fails open on parse/API errors so we never silently drop trades.
#
# Cycle-13 token reduction (see also news_memory.short_circuit_labels):
#   • min_top_similarity: 0.45 — if the best candidate market has cosine
#     similarity below this, skip Stage 2 + Stage 3 entirely. Saves the
#     LLM call on headlines that don't have any strong-match market.
relevance:
  enabled: true
  model: "google/gemini-2.5-flash-lite"
  temperature: 0.1
  # 2026-05-21: TIGHTENED to STRONG_YES only based on 30-day forensic:
  # STRONG_YES = +$2.05 over 100 closed trades (56.5% hit). YES =
  # −$3.49 over 396 trades (38.4% hit). WEAK is worse. Production
  # engines accept only STRONG_YES. Scout (research) overrides via
  # its own relevance_keep_scores list (config below) to see the
  # broader corpus for backtest data collection.
  keep_scores: ["STRONG_YES"]
  max_tokens_per_market: 60
  # Phase-E E2 (2026-05-19): restored to 0.55 after the 0.0 experiment
  # showed sub-0.45 similarity trades hit 17.8% vs 0.65-0.75 at 50%.
  # The flood of low-quality matches cost ~$2.6 over 117 trades.
  # 2026-05-20 drought-fix: lowered from 0.55 → 0.30 (matches the
  # markets.similarity_threshold env default in docker-compose.yml). Phase
  # E.1's E2 gate raised this to 0.55 on small-sample evidence; combined
  # with the freshness short-circuit bug, broken-MTM lessons, AND the
  # markets.similarity_threshold env-override discrepancy (0.35 vs YAML
  # 0.55) it contributed to the 100%-NEUTRAL drought. Single floor at
  # 0.30 — matches at all are uncommon, let the LLM + edge model do the
  # actual filtering. Tighten back to 0.45 if signal proves poor.
  min_top_similarity: 0.30

# ── Paper trading ────────────────────────────────────────────────────────────
trading:
  balance_usdc: 1000.0        # only used when infinite_balance is false
  max_position_usdc: 100.0    # max USDC staked per single trade
  min_trade_usdc: 5.0         # never trade below this size (avoids rounding noise)
  min_edge: 0.04              # minimum edge (p_hat − mid) required to execute
  edge_increment: 0.12        # edge at confidence=1.0; scales linearly with confidence
                              # edge = edge_increment × (2×confidence − 1)
  position_timeout_hours: 24  # close any position open longer than this
  max_open_positions: 20      # hard cap on concurrent open positions
  max_unique_markets: 15      # max distinct markets with open positions at once
  cold_position_hours: 4.0    # hours since last headline match before a losing market is culled
                              # (was 12.0; cycle-10: 13-of-14 TIMEOUTs were losses — shorter leash)
  # When true: never block on balance. Keep buying until position caps or
  # timeouts close trades. The "balance" displayed is then cumulative
  # realized PnL (gain). Position-side caps (max_open / max_unique /
  # cold-cull / timeout / WIN / LOSS) still apply.
  infinite_balance: false
  mode: "simulate"
  # ── Simulate mode ──────────────────────────────────────────────────
  # Phase E.7.3 (2026-05-19): 8 active variants × $100 each = $800.
  # Reset cycle with evolutionary expansion — 3 parents + 5 mutants.
  # AI calls pause automatically when no variant has free capital.
  # M4 expansion: 14 engines × $100 = $1400. Each engine has its own pot;
  # the total is split evenly by the simulate-mode bootstrap.
  # 2026-05-20: bumped to 1450 so scout's fixed $50 pot sits OUTSIDE the
  # 14-engine production split (14 × $100 = $1400 still flows to real
  # engines). Restore to 1400.0 if scout is retired.
  # 2026-05-22: bumped 1450 → 1600 for the master-plan-Part-8 expansion:
  #   - super_scout fixed $50 pot (loosest-of-everything research engine)
  #   - loose_relevance_yes new top-level production engine, $100 pot
  # Total: 14 production × $100 + scout $50 + super_scout $50
  #        + loose_relevance_yes $100 = $1600.
  simulate_total_usdc: 1600.0
  simulate_min_trade_usdc: 1.0
  # Soft rail-skip: reject trades when the entry-side mid is within this
  # distance of 0/1. 6h backtest: 99% of p≥0.95 entries were no_signal — the
  # market is pinned and the headline can't move it. Per-engine override
  # allowed (aggressive opts out to keep its TP harvesters running).
  rail_skip_threshold: 0.05
  # Hard rail floor — applies on top of the soft rail, default-on for every
  # engine. At p ≥ 0.98 (or ≤ 0.02) the bid-ask spread alone routinely
  # exceeds aggressive's SL=0.015, so SL fires on spread movement before
  # any signal arrives. Keep this small.
  entry_rail_skip_threshold: 0.02

# ── Trading engines ──────────────────────────────────────────────────────────
# Each engine runs the same headlines with its own rule set.
# Unset fields inherit from global `trading:` defaults above.
# Results are compared in data/dashboard/engine_comparison.txt.
# Remove this section entirely for a single default engine.
#
# Variants (cycle 8): each engine declares a `variants:` list of shadow
# strategies that share the engine's batched AI call but evaluate their own
# buy/sell rules and write trades tagged with the variant name. AI token cost
# is flat regardless of variant count — `classify_batch` is hoisted to the
# runner level (see EngineRunner / build_engines). Use variants to sweep
# confidence gates, TP/SL pairs, and invert flips cheaply; see
# data/dashboard/variant_compare.txt for the live leaderboard.
engines:
  # ── Aggressive engine retired 2026-05-19 ──────────────────────────────────
  # All 5 surviving aggressive variants closed net-negative in the post-
  # simulate-mode 5h soak (worst: _norail -1.08, base -0.74, _lowvol -0.62,
  # _slpct10 -0.46, _tp010_sl020 -0.10). The cycle-3 "aggressive harvests
  # volatility" thesis no longer holds under the friction-aware paper trader
  # at the $50/engine micro-bankroll. Variant configs preserved in git
  # history (a39b0c8) for revival if a future cycle finds the regime change.

  - name: "balanced"
    min_edge: 0.03
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.40
    max_open_positions: 20
    take_profit:      0.020
    stop_loss:        0.030
    trailing_stop:    0.010
    min_hold_seconds: 300
    # A4B.4 (2026-05-23) phased rollout — keep the legacy edge gate while
    # the calibration curves accumulate samples + the EV math gets retuned.
    # Backtest 2026-05-18..23 (270 baseline trades) showed isotonic
    # calibration deflates p_alpha 0.65 → 0.33 so far that the true-EV gate
    # AND Kelly sizing reject every entry (size_too_small + kelly_negative_edge
    # = 100% skips). See seulgi/reports/2026-05-23-a4b4-threshold-tune.md.
    # Restore to inheriting the global default once calibration_method:
    # platt or a model upgrade brings p_calibrated within ~5pp of p_alpha.
    use_true_ev_formula: false
    variants:
      # 2026-05-19 Phase-E cut: drop _lowvol — forensic showed vol<0.005
      # bucket (which is where the _lowvol filter lands trades) had hit
      # 32.3% / −$3.10 across 158 trades. The "low-vol = stable" thesis
      # is wrong: low-vol = "no flow, no edge".
      # 2026-05-19 earlier cut: removed _tp010_sl020 (-0.08),
      # _inv65 (-0.27), _norail (-0.17).
      # Earlier retirements (2026-05-17): conf40_tp020_sl030, _conf55, _conf70.
      #
      # 2026-05-19 Phase E.7.3 evolutionary expansion: 2 parents +
      # 3 balanced mutants. Mutations vary one feature at a time
      # against the wide-exit parent so per-variant attribution stays
      # clean. E.5b rolling hit-rate guard provides defensive kill.
      - name: "conf40_tp030_sl050"          # parent: wide exits
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
      - name: "conf40_tp020_sl030_slpct10"  # parent: price-relative SL floor
        stop_loss_pct: 0.10
      - name: "conf40_tp030_sl050_slpct10"  # mutant: wide exits + pct floor
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
        stop_loss_pct: 0.10
      - name: "conf45_tp030_sl050"          # mutant: tighter conf gate on wide
        min_confidence: 0.45
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
      - name: "conf40_tp025_sl045"          # mutant: slightly tighter exits
        take_profit:   0.025
        stop_loss:     0.045
        trailing_stop: 0.012
      # ── M4 expansion (2026-05-19) ─────────────────────────────────────
      # Forensic on 192 closed trades shows YES direction is +EV (+$0.22,
      # 50.7% hit) while NO loses hard (-$4.62, 19.8% hit). EVOLVING
      # freshness beats BREAKING by ~33pp on hit-rate. mid_yes in
      # [0.75, 0.85] had 60% hit-rate. These variants opt into those
      # individual edges so we can score each in isolation.
      - name: "conf40_tp025_sl045_yes_only"
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        direction_filter: "YES"
      - name: "conf40_tp025_sl045_evolving"
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        freshness_filter: "EVOLVING"
      - name: "conf40_tp025_sl045_mid075"   # narrow to historical best band
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        mid_yes_min: 0.75
        mid_yes_max: 0.85
      - name: "conf40_tp020_sl030_lowvol_resurrected"
        # Lifetime 67% hit / +$0.07 in 5 trades. The "low vol = no flow"
        # E.4 cut thesis is contradicted by this variant's own record;
        # resurrected with the wide-exit set (closer to the survivors).
        take_profit:    0.020
        stop_loss:      0.030
        trailing_stop:  0.010
        max_market_vol_30m: 0.0050
      - name: "conf50_tp025_sl045"
        # Higher conf gate — historical conf 0.7-0.75 hit 38.2% while
        # 0.6-0.7 hit only 5.1%. Test whether tightening to 0.50
        # admit-floor materially raises hit-rate (downstream of
        # ai_cfg.min_confidence which is 0.45 for most variants).
        min_confidence: 0.50
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012

      # ── 2026-05-22 loosen-one-knob variants (master plan Part 8) ─────
      # Each variant relaxes EXACTLY one filter vs the conf40_tp025_sl045
      # parent so per-filter PnL attribution stays clean in
      # data/dashboard/variant_compare.txt. Token cost stays flat:
      # classify_batch + relevance are shared per-headline across
      # variants. See plans/do-the-next-task-rustling-seahorse.md.
      - name: "loose_confidence_035"
        # Loosens AI confidence floor 0.40 → 0.35. The new prediction
        # model (gemini-2.5-flash post-revert) has a slightly different
        # confidence distribution; this catches the 0.35-0.40 band.
        min_confidence: 0.35
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
      - name: "loose_mid_band_058"
        # Loosens the mid-price floor: enters in 0.58-0.65 (which the
        # RULE_mid_below_065 pre-AI rule currently blocks for production).
        # That rule was the 3rd biggest skip class today; super_scout
        # opts out of it entirely — this variant tests the 0.58-0.65
        # slice in isolation with normal production stake size.
        min_confidence: 0.40
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        mid_yes_min:    0.58
        mid_yes_max:    0.85
      - name: "loose_rail_floor_001"
        # Loosens the hard-rail floor 0.02 → 0.01. Lets entries near 0.99
        # or 0.01 through; tests whether the bid-ask spread really
        # exceeds SL=0.045 at that range under the wide-exit set.
        min_confidence: 0.40
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        entry_rail_skip_threshold: 0.01

  # conservative engine removed in cycle 4 — prior postmortem showed −$88.46 PnL
  # (lowest of all engines); dropping it gives a cleaner three-engine comparison
  # (aggressive vs balanced vs inverted_highconf).

  # Shadow strategy: same rules as balanced, but flips direction when the AI
  # is highly confident (conf ≥ 0.85) AND the mid is off the rails. Tests the
  # 6h finding that high-confidence calls have IC<0 (anti-informative).
  # If this engine outperforms balanced over the next 24h, the LLM signal is
  # the failure mode rather than the rule set, and we should ship the
  # inversion as a global gate.
  - name: "inverted_highconf"
    min_edge: 0.03
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.40
    max_open_positions: 20
    take_profit:      0.020
    stop_loss:        0.030
    trailing_stop:    0.010
    min_hold_seconds: 300
    # A4B.4 (2026-05-23) phased rollout — see balanced engine note.
    use_true_ev_formula: false
    invert_high_conf: true
    # Lowered from 0.85 → 0.75: the 0.75-0.85 bucket was also flat/anti-
    # informative in the 6h analysis (n=21, 100% no_signal). Catching it too
    # gives the shadow engine enough signal to actually execute trades.
    invert_conf_threshold: 0.75
    variants:
      # 2026-05-19 Phase-E cut: drop _lowvol (see balanced engine note).
      # 2026-05-19 earlier cut: removed _inv65 (-0.27), _tp010_sl020_inv75
      # (-0.08), _hi75 (-0.17), _hi65 (-0.07).
      #
      # 2026-05-19 Phase E.7.3 evolutionary expansion: 1 parent +
      # 2 inverted mutants — cross-breed with best balanced features
      # (slpct10) and tighter conf gate.
      - name: "conf40_tp030_sl050_inv75"            # parent: wide exits
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
      - name: "conf40_tp030_sl050_slpct10_inv75"    # mutant: wide + pct + inv
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
        stop_loss_pct: 0.10
      - name: "conf45_tp030_sl050_inv75"            # mutant: tighter conf + inv
        min_confidence: 0.45
        take_profit:   0.030
        stop_loss:     0.050
        trailing_stop: 0.015
      # M4 expansion: cross the inversion thesis with the freshness
      # finding (EVOLVING ~3x hit-rate of BREAKING).
      - name: "conf40_tp025_sl045_evolving_inv75"
        take_profit:    0.025
        stop_loss:      0.045
        trailing_stop:  0.012
        freshness_filter: "EVOLVING"

  # ── SCOUT — research engine, all gates wide open ─────────────────────────
  # Purpose: trade on EVERY non-NEUTRAL LLM signal so we can post-hoc
  # analyze the full decision funnel: which filters pass/fail, what each
  # variant filter would have killed, where the LLM's edge actually lives.
  # Every decision lands in `trades` with a full `trader_trace` JSON. Scout
  # exists OUTSIDE the 14-engine production split (own $50 pot, bumped in
  # simulate_total_usdc → $1450). Bypasses Kelly via the `scout` name
  # prefix check in trader.py (fixed micro-stakes regardless of edge sign).
  # Companion script: scripts/analysis/scout_funnel.py reads trader_trace
  # for filter-by-filter pass/cut stats.
  - name: "scout"
    balance_usdc: 50.0
    min_edge: -10.0           # admit any signal (including negative-edge)
    edge_increment: 0.12
    max_position_usdc: 1.0    # $1 stake per trade — high volume, low risk
    min_confidence: 0.0       # admit any AI signal, even very low p_alpha
    max_open_positions: 50    # cap total exposure but allow burst data
    take_profit:      0.05
    stop_loss:        0.05
    trailing_stop:    0.020
    min_hold_seconds: 60
    # 2026-05-21: scout broadens the relevance gate to collect research
    # data on markets production engines drop. Production's global
    # default is ["STRONG_YES"] (the only profitable bucket per 30-day
    # forensic); scout adds YES and WEAK to see ~30% of all verdicts
    # instead of ~1%. The prediction LLM runs on the union (= scout's
    # set) so cost is paid once for all engines.
    relevance_keep_scores: ["STRONG_YES", "YES", "WEAK"]
    variants:
      - name: "all_signals"

  # ── LOOSE_RELEVANCE_YES — production-flavoured engine, relevance loosened
  # Same risk model as balanced (own $100 pot, conf 0.40, wide TP/SL exits)
  # but broadens the Stage-2 keep_scores to admit YES verdicts alongside
  # STRONG_YES. The 30-day forensic that put production on STRONG_YES-only
  # had n=396 YES trades (−$3.49); this engine continues to test that
  # bucket with current data + the reverted gemini-2.5-flash model so we
  # have a fresh sample. relevance_keep_scores is an engine-level field
  # (cannot be set per-variant) — that's why this is a separate engine
  # rather than a balanced variant.
  - name: "loose_relevance_yes"
    min_edge: 0.03
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.40
    max_open_positions: 20
    take_profit:      0.025
    stop_loss:        0.045
    trailing_stop:    0.012
    min_hold_seconds: 300
    # A4B.4 (2026-05-23) phased rollout — see balanced engine note.
    use_true_ev_formula: false
    relevance_keep_scores: ["STRONG_YES", "YES"]
    variants:
      - name: "default"

  # ── SUPER_SCOUT — master plan Part 8 shipped 2026-05-22 ──────────────────
  # Loosest-possible engine: union of the loosest tunable value from every
  # other engine + opts out of every pre-AI / post-AI rule via the rule
  # frontmatter (engines_exclude). Every plausible signal lands as a $0.05
  # micro-stake trade row; the scout_funnel report attributes filter cost
  # per gate. AI tokens stay flat — classify_batch + the union-of-keep_scores
  # relevance pass run once per headline and feed all engines.
  #
  # Capital model: own $50 pot, $0.05/stake, tight TP/SL (0.05/0.05) so
  # capital cycles via fills rather than 24h timeouts (user choice
  # 2026-05-22). Tradeoff: we measure "did mid move ±5% within hold"
  # rather than the natural signal horizon — acceptable for filter
  # attribution, not for absolute alpha measurement.
  - name: "super_scout"
    balance_usdc: 50.0
    min_edge: -10.0             # admit any signal incl. negative-edge
    edge_increment: 0.12
    max_position_usdc: 0.05     # $0.05 micro-stake; recycles via TP/SL
    min_confidence: 0.0         # admit any non-NEUTRAL LLM verdict
    max_open_positions: 500     # data breadth over capital discipline
    take_profit:      0.05
    stop_loss:        0.05
    trailing_stop:    0.02
    min_hold_seconds: 60
    # Every per-engine filter disabled (or set to its loosest value):
    mid_yes_min: 0.0
    mid_yes_max: 1.0
    min_entry_yes_mid: 0.0
    max_market_vol_30m: 0.0
    rail_skip_threshold: 0.0
    entry_rail_skip_threshold: 0.0
    spread_cost_bps: 0.0
    invert_high_conf: false
    relevance_keep_scores: ["STRONG_YES", "YES", "WEAK", "NO"]
    variants:
      - name: "all_signals"

# ── Database ─────────────────────────────────────────────────────────────────
db:
  path: "/data/seulgi.db"

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  data_dir: "/data/dashboard"   # all .txt files written here
  interval_secs: 30             # refresh interval; urgent events trigger faster

# ── News deduplication + freshness (ChromaDB) ────────────────────────────────
# Beyond binary dedup, the freshness module (cycle 9) labels every incoming
# headline as one of BREAKING / EVOLVING / REHASH / STALE_RETURN based on
# distance to the nearest stored neighbour AND how long ago that neighbour
# landed. The label is injected into Stage-2 (relevance) and Stage-3
# (prediction) prompts so the LLM can reason about prior coverage.
news_memory:
  path: "/data/news_chroma"           # ChromaDB persistent directory
  dedup_distance_threshold: 0.12      # cosine distance below this = republish (~0.88 sim)
  fresh_dist_threshold: 0.30          # > this ⇒ BREAKING regardless of age
  rehash_age_secs: 21600              # 6h — REHASH window for near-duplicates
  stale_age_secs: 86400               # 24h — STALE_RETURN window
  recent_context_window_secs: 86400   # how far back to gather prior coverage
  recent_context_n: 3                 # top-N similar prior headlines fed to AI
  # Cycle-13 token reduction: freshness labels that bypass Stage 2 + Stage 3
  # entirely (per-variant skip rows still written for accounting). STALE_RETURN
  # added after the cycle-12 per-label win/loss report showed it cost
  # −$138.64 across 26 closed trades. Removing it from this list re-enables
  # the AI on STALE_RETURN headlines without a rebuild.
  short_circuit_labels: []

# ── Brave Search budget ──────────────────────────────────────────────────────
# Shared across all Twitter watchers. Free tier = 2000/month (~67/day, ~3/hr).
# Set to 20 to be safe; increase if you upgrade your plan.
search_budget:
  brave_per_hour: 20

# ── Phase 4D.2 — macro tag-based routing ────────────────────────────────────
# Cheap keyword pre-classifier (app/tagger.py) tags each headline with macro
# categories (interest_rates, geopolitics, elections, sports, weather, tech,
# crypto, earnings). Tagged headlines bypass the SBERT cosine gate and route
# to markets whose questions mention the tag's bucket keywords. The keyword
# maps themselves live in app/tagger.py (code, not config) so changes go
# through PR review. See seulgi/master-plan.md A0.9 + 4D.2.
tagger:
  enabled: true
  min_tag_confidence: 1.0          # exact keyword match required
  max_tag_routed_per_headline: 10  # cap so a generic tag can't starve cosine

# ── Logging ──────────────────────────────────────────────────────────────────
log_level: "INFO"               # DEBUG for verbose Playwright + embedding output

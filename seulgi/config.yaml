# ── RSS / Atom feed subscribers (cycle 8) ────────────────────────────────────
# Outlets identified as feed-capable in cycle 4's preflight, ranked by churn
# (headlines per 5 min). FeedWatcher fetches the feed via the scraper's
# /feed endpoint instead of running Playwright on the homepage — typical
# fetch is ~50 ms instead of 3–10 s. The companion HTML entries above have
# NOT been removed for these domains, intentionally — the feed often
# surfaces section headlines while the homepage shows above-the-fold
# bigger stories. Both have their own dedup so we don't double-emit.
feeds:
  - site_url: "https://www.timesofisrael.com/"
    feed_url: "https://www.timesofisrael.com/feed/"
    interval_seconds: 60

  - site_url: "https://www.thehindu.com/news/"
    feed_url: "https://www.thehindu.com/news/feeder/default.rss"
    interval_seconds: 90

  - site_url: "https://www.aljazeera.com/news/"
    feed_url: "https://www.aljazeera.com/xml/rss/all.xml"
    interval_seconds: 90

# ── Social accounts to monitor (Twitter/X and Truth Social) ──────────────────
# These fire into the same headline pipeline as news sites.
# Tweets/posts are tagged source="twitter" or "truth_social" in the DB.
# Requires SEARCH_API_KEY (Brave) set in scraper's .env for Twitter.
# Truth Social uses public RSS — no key needed.
social_accounts:
  # Cycle-8: dropped Twitter watchers. Cycle 7 data: 885 twitter signals
  # produced 7 trades for +$1.43 total (noise) and consumed Brave API budget
  # continuously. Truth Social stays — it's free public RSS, no Brave cost.
  # If we re-add Twitter, we should first switch to a nitter mirror so it
  # doesn't compete with anything else for the Brave hourly cap.
  - username: "realDonaldTrump"
    platform: "truth_social"
    interval_seconds: 60

# ── Market index ─────────────────────────────────────────────────────────────
markets:
  refresh_hours: 4             # re-fetch Polymarket market list every N hours
  similarity_threshold: 0.55   # min cosine similarity to include a market match
                               # Raised from 0.35 → 0.55 after the 6h analysis:
                               # sub-0.55 matches were dominated by spurious
                               # keyword overlaps (Rick Rieder → Rick Devens,
                               # OPEC cuts demand → OPEC dissolves, etc.).
                               # Mirrors impact_tracker's MIN_SIMILARITY.
  top_k: 25                    # max markets to evaluate per headline (AI batch size)
                               # Cycle-8: raised 15 → 25 to widen the trade
                               # funnel and produce more closed trades per
                               # hour (~5/hr → ~8/hr expected). With the
                               # 0.55 similarity floor still active, the
                               # extra 10 slots only fire when there really
                               # are 25 above-threshold matches — typically
                               # only on big political stories, so the
                               # marginal token cost is bounded.
  max_tracked_markets: 20000   # cap index at top-N markets by volume (0 = no cap)
                               # 20k × ~1.5KB embedding ≈ 30MB; matching is numpy
                               # cosine over a (N, 384) matrix — sub-10ms at N=20k.
                               # A wider universe means each headline's top-15 is
                               # drawn from a much broader pool — better matches
                               # without raising per-headline LLM cost.

# ── AI direction classifier (via OpenRouter) ─────────────────────────────────
# OpenRouter model IDs: https://openrouter.ai/models
# Good options: google/gemini-2.5-flash  (fast + cheap)
#               anthropic/claude-haiku-4-5  (reliable JSON)
#               meta-llama/llama-3.1-8b-instruct  (free tier)
ai:
  model: "google/gemini-2.5-flash-lite"    # cheap model for all batches
  # premium_model: "google/gemini-2.5-flash"  # uncomment to use a better model
  #                                            # for high-similarity (≥ threshold) batches
  # premium_sim_threshold: 0.70               # similarity floor for premium routing
  api_key: ""                 # leave blank → uses OPENROUTER_API_KEY env var
  api_base: "https://openrouter.ai/api/v1"
  # Ensemble (cycle 6): N parallel classifier calls at higher temperature,
  # then average distributions + majority vote. Confidence is reported as
  # mean_p_winner × agreement_fraction — so a unanimous 0.6 vote scores 0.60,
  # a 2/3 vote at mean 0.5 scores ~0.33, and a 1/1/1 tie scores 0.
  ensemble_samples: 3
  ensemble_temperature: 0.5
  # Agreement is gated separately (`min_agreement`); confidence stays on the
  # model's native probability scale so the edge model's `2·conf − 1` rescale
  # still works (it would floor to 0 if we baked agreement into confidence).
  min_agreement: 0.66         # 2-of-3 majority required for an ensemble of 3
  min_confidence: 0.35        # below this → treat as NEUTRAL, skip trade

# ── Paper trading ────────────────────────────────────────────────────────────
trading:
  balance_usdc: 1000.0        # only used when infinite_balance is false
  max_position_usdc: 100.0    # max USDC staked per single trade
  min_trade_usdc: 5.0         # never trade below this size (avoids rounding noise)
  min_edge: 0.04              # minimum edge (p_hat − mid) required to execute
  edge_increment: 0.12        # edge at confidence=1.0; scales linearly with confidence
                              # edge = edge_increment × (2×confidence − 1)
  position_timeout_hours: 24  # close any position open longer than this
  max_open_positions: 20      # hard cap on concurrent open positions
  max_unique_markets: 15      # max distinct markets with open positions at once
  cold_position_hours: 12.0   # hours since last headline match before a losing market is culled
  # When true: never block on balance. Keep buying until position caps or
  # timeouts close trades. The "balance" displayed is then cumulative
  # realized PnL (gain). Position-side caps (max_open / max_unique /
  # cold-cull / timeout / WIN / LOSS) still apply.
  infinite_balance: true
  mode: "paper"
  # Soft rail-skip: reject trades when the entry-side mid is within this
  # distance of 0/1. 6h backtest: 99% of p≥0.95 entries were no_signal — the
  # market is pinned and the headline can't move it. Per-engine override
  # allowed (aggressive opts out to keep its TP harvesters running).
  rail_skip_threshold: 0.05
  # Hard rail floor — applies on top of the soft rail, default-on for every
  # engine. At p ≥ 0.98 (or ≤ 0.02) the bid-ask spread alone routinely
  # exceeds aggressive's SL=0.015, so SL fires on spread movement before
  # any signal arrives. Keep this small.
  entry_rail_skip_threshold: 0.02

# ── Trading engines ──────────────────────────────────────────────────────────
# Each engine runs the same headlines with its own rule set.
# Unset fields inherit from global `trading:` defaults above.
# Results are compared in data/dashboard/engine_comparison.txt.
# Remove this section entirely for a single default engine.
engines:
  - name: "aggressive"
    min_edge: 0.005           # fire on almost any positive edge
    edge_increment: 0.20
    max_position_usdc: 150.0
    min_confidence: 0.25      # fires at conf ≥ 0.51 (edge = 0.20 × 0.02 > 0.005)
    max_open_positions: 30
    # Technical exits — micro-wins, recycle slots fast.
    take_profit:      0.005   # close at +0.5¢ MTM
    stop_loss:        0.015   # cut at -1.5¢ MTM
    trailing_stop:    0.003   # after being in profit, lock in if 0.3¢ off the peak
    min_hold_seconds: 60
    # Aggressive harvests noise via TP=0.5¢ and was profitable in the 6h run
    # despite IC<0; preserve its behaviour as a regression check by opting
    # out of the rail-skip filter.
    rail_skip_threshold: 0.0

  - name: "balanced"
    min_edge: 0.03
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.40
    max_open_positions: 20
    take_profit:      0.020
    stop_loss:        0.030
    trailing_stop:    0.010
    min_hold_seconds: 300

  # conservative engine removed in cycle 4 — prior postmortem showed −$88.46 PnL
  # (lowest of all engines); dropping it gives a cleaner three-engine comparison
  # (aggressive vs balanced vs inverted_highconf).

  # Shadow strategy: same rules as balanced, but flips direction when the AI
  # is highly confident (conf ≥ 0.85) AND the mid is off the rails. Tests the
  # 6h finding that high-confidence calls have IC<0 (anti-informative).
  # If this engine outperforms balanced over the next 24h, the LLM signal is
  # the failure mode rather than the rule set, and we should ship the
  # inversion as a global gate.
  - name: "inverted_highconf"
    min_edge: 0.03
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.40
    max_open_positions: 20
    take_profit:      0.020
    stop_loss:        0.030
    trailing_stop:    0.010
    min_hold_seconds: 300
    invert_high_conf: true
    # Lowered from 0.85 → 0.75: the 0.75-0.85 bucket was also flat/anti-
    # informative in the 6h analysis (n=21, 100% no_signal). Catching it too
    # gives the shadow engine enough signal to actually execute trades.
    invert_conf_threshold: 0.75

# ── Database ─────────────────────────────────────────────────────────────────
db:
  path: "/data/seulgi.db"

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  data_dir: "/data/dashboard"   # all .txt files written here
  interval_secs: 30             # refresh interval; urgent events trigger faster

# ── News deduplication (ChromaDB) ────────────────────────────────────────────
news_memory:
  path: "/data/news_chroma"           # ChromaDB persistent directory
  dedup_distance_threshold: 0.12      # cosine distance below this = republish (~0.88 sim)

# ── Brave Search budget ──────────────────────────────────────────────────────
# Shared across all Twitter watchers. Free tier = 2000/month (~67/day, ~3/hr).
# Set to 20 to be safe; increase if you upgrade your plan.
search_budget:
  brave_per_hour: 20

# ── Quant plotter ────────────────────────────────────────────────────────────
# Periodically renders matplotlib charts of price-impact stats to
# data/dashboard/plots/*.png. Uses ALL available data — longer run = richer plot.
plotter:
  interval_secs: 600   # 10 minutes

# ── Logging ──────────────────────────────────────────────────────────────────
log_level: "INFO"               # DEBUG for verbose Playwright + embedding output

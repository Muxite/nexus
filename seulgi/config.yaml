# Seulgi configuration
# All values can be overridden with env vars: SEULGI__SECTION__KEY=value
# e.g.  SEULGI__TRADING__BALANCE_USDC=500
#       SEULGI__DASHBOARD__INTERVAL_SECS=15

# ── News sites to watch ──────────────────────────────────────────────────────
watched_sites:
  - url: "https://apnews.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.bbc.com/news"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.reuters.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.politico.com"
    change_wait_seconds: 25
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.axios.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.aljazeera.com"
    change_wait_seconds: 25
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.theguardian.com/world"
    change_wait_seconds: 25
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.wsj.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.ft.com"
    change_wait_seconds: 25
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.nytimes.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.washingtonpost.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://thehill.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

  - url: "https://www.bloomberg.com/markets"
    change_wait_seconds: 20
    reload_seconds: 240
    max_failures: 5

  - url: "https://www.cnbc.com/world/?region=world"
    change_wait_seconds: 20
    reload_seconds: 240
    max_failures: 5

  - url: "https://www.cnn.com"
    change_wait_seconds: 20
    reload_seconds: 300
    max_failures: 5

# ── Market index ─────────────────────────────────────────────────────────────
markets:
  refresh_hours: 4            # re-fetch Polymarket market list every N hours
  similarity_threshold: 0.35  # min cosine similarity to include a market match
  top_k: 15                   # max markets to evaluate per headline

# ── AI direction classifier (via OpenRouter) ─────────────────────────────────
# OpenRouter model IDs: https://openrouter.ai/models
# Good options: google/gemini-2.5-flash  (fast + cheap)
#               anthropic/claude-haiku-4-5  (reliable JSON)
#               meta-llama/llama-3.1-8b-instruct  (free tier)
ai:
  model: "google/gemini-2.5-flash-lite-preview-06-17"
  api_key: ""                 # leave blank → uses OPENROUTER_API_KEY env var
  api_base: "https://openrouter.ai/api/v1"
  min_confidence: 0.45        # below this → treat as NEUTRAL, skip trade

# ── Paper trading ────────────────────────────────────────────────────────────
trading:
  balance_usdc: 1000.0
  max_position_usdc: 100.0    # max USDC staked per single trade
  min_trade_usdc: 5.0         # never trade below this size (avoids rounding noise)
  min_edge: 0.04              # minimum edge (p_hat − mid) required to execute
  edge_increment: 0.12        # edge at confidence=1.0; scales linearly with confidence
                              # edge = edge_increment × (2×confidence − 1)
  position_timeout_hours: 24  # close any position open longer than this
  max_open_positions: 20      # hard cap on concurrent open positions
  mode: "paper"

# ── Trading engines ──────────────────────────────────────────────────────────
# Each engine runs the same headlines with its own rule set.
# Unset fields inherit from global `trading:` defaults above.
# Results are compared in data/dashboard/engine_comparison.txt.
# Remove this section entirely for a single default engine.
engines:
  - name: "aggressive"
    min_edge: 0.03
    edge_increment: 0.15
    max_position_usdc: 150.0
    min_confidence: 0.40
    max_open_positions: 30

  - name: "conservative"
    min_edge: 0.08
    edge_increment: 0.10
    max_position_usdc: 50.0
    min_confidence: 0.60
    max_open_positions: 10

  - name: "balanced"
    # inherits all global trading defaults
    min_edge: 0.05
    edge_increment: 0.12
    max_position_usdc: 100.0
    min_confidence: 0.50

# ── Database ─────────────────────────────────────────────────────────────────
db:
  path: "/data/seulgi.db"

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  data_dir: "/data/dashboard"   # all .txt files written here
  interval_secs: 30             # refresh interval; urgent events trigger faster

# ── Logging ──────────────────────────────────────────────────────────────────
log_level: "INFO"               # DEBUG for verbose Playwright + embedding output

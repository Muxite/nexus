# NOTE: Seulgi is included in the root jennie/docker-compose.yml and should
# normally be started from there so it can depend on the scraper:
#
#   docker compose up scraper seulgi        (from jennie/)
#
# This standalone file is provided for local development only (e.g. when
# the scraper is already running separately).  It does NOT enforce scraper
# readiness — start the scraper first.

services:
  seulgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seulgi
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
      - seulgi_model_cache:/root/.cache/torch/sentence_transformers
    environment:
      - SEULGI_CONFIG=/config/config.yaml
      - SCRAPER_URL=${SCRAPER_URL:-http://scraper:9000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEULGI__TRADING__BALANCE_USDC=${SEULGI__TRADING__BALANCE_USDC:-1000.0}
      - SEULGI__TRADING__MAX_POSITION_USDC=${SEULGI__TRADING__MAX_POSITION_USDC:-100.0}
      - SEULGI__TRADING__MIN_EDGE=${SEULGI__TRADING__MIN_EDGE:-0.04}
      - SEULGI__MARKETS__SIMILARITY_THRESHOLD=${SEULGI__MARKETS__SIMILARITY_THRESHOLD:-0.35}
      - SEULGI__AI__MIN_CONFIDENCE=${SEULGI__AI__MIN_CONFIDENCE:-0.45}
      # 2026-05-21: plotter disabled by default after a SIGSEGV restart loop
      # caught by faulthandler — matplotlib backend_agg.draw_path crashes
      # inside the default ThreadPoolExecutor on first chart render.
      # Set =0 to re-enable once the plotter is moved to a dedicated
      # single-thread executor (or subprocess isolation).
      - SEULGI_DISABLE_PLOTTER=${SEULGI_DISABLE_PLOTTER:-1}
    env_file:
      - path: ./.env
        required: false
    networks:
      - jennie_default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  seulgi_model_cache:

networks:
  jennie_default:
    external: true

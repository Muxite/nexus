# This file is the ONE WAY to start seulgi.
#
#   docker compose -f seulgi/docker-compose.yml up -d seulgi
#
# The root nexus/docker-compose.yml deliberately does NOT define a seulgi
# service. On 2026-05-21 a container started from the root compose and one
# started from this file ran at the same time against the same data/seulgi.db
# and data/news_chroma, corrupting the chromadb HNSW index. One canonical
# container per agent is the fix.
#
# Prerequisites:
#   - The shared scraper must already be up on the `nexus_default` network:
#     `docker compose up -d ujin` from the repo root. That command also
#     creates the network. This file does NOT enforce scraper readiness.

services:
  seulgi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seulgi
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
      - seulgi_model_cache:/root/.cache/torch/sentence_transformers
    environment:
      - SEULGI_CONFIG=/config/config.yaml
      # nexus: ujin (services/ujin) replaces the old v1 scraper on :9000.
      - SCRAPER_URL=${SCRAPER_URL:-http://nexus-ujin:8901}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEULGI__TRADING__BALANCE_USDC=${SEULGI__TRADING__BALANCE_USDC:-1000.0}
      - SEULGI__TRADING__MAX_POSITION_USDC=${SEULGI__TRADING__MAX_POSITION_USDC:-100.0}
      - SEULGI__TRADING__MIN_EDGE=${SEULGI__TRADING__MIN_EDGE:-0.04}
      - SEULGI__MARKETS__SIMILARITY_THRESHOLD=${SEULGI__MARKETS__SIMILARITY_THRESHOLD:-0.35}
      - SEULGI__AI__MIN_CONFIDENCE=${SEULGI__AI__MIN_CONFIDENCE:-0.45}
      - SEULGI_BYPASS_LLM=${SEULGI_BYPASS_LLM:-0}
      - SEULGI_DISABLE_HOUR_GATE=${SEULGI_DISABLE_HOUR_GATE:-0}
    env_file:
      - path: ./.env
        required: false
    networks:
      - nexus_default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  seulgi_model_cache:

networks:
  nexus_default:
    external: true

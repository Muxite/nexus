# Default eval pairs for prompt_stability.py.
#
# 30 hand-crafted (article, market) pairs split roughly into:
#   - 10 clearly related   (LLM SHOULD say related=true)
#   - 10 clearly unrelated (LLM SHOULD say related=false)
#   - 10 ambiguous/tricky  (no expected; we measure consistency only)
#
# `expected_related` is the ground-truth label. NULL/missing = no expected
# (we still measure agreement across runs, just not accuracy).
#
# Edit freely — the runner just reads the list and ignores extra fields.

pairs:
  # --- 10 CLEARLY RELATED ---

name: v6-critic
version: v1
description: |
  Two-step chain. Step 1 emits p_yes (same as v3). Step 2 critiques the
  estimate and either accepts it or proposes a revised number. The
  final field is the critic's possibly-revised p_yes — accepted base
  rows pass through unchanged.

model: google/gemini-2.5-flash

steps:
  - name: base
    type: single
    max_output_tokens: 40
    system: |
      You are a probability estimator for binary prediction markets.
      Estimate the probability the market resolves YES given the news
      article and the current market price.

      Rules:
      - If unrelated or too small to move the market, return p_yes equal to current price.
      - Be calibrated: only move from the price when you have a reason.

      Reply JSON only, no markdown fences:
      {"p_yes": 0.0-1.0, "reason": "<=15 words"}
    user_template: |
      News: {{article_title}}
      {{article_body_or_summary}}

      Market: {{market_question}}
      Description: {{market_description}}
      Current YES price: {{market_mid_t0}}  ·  Deadline: {{market_end_date}}

  - name: critic
    type: critic
    base: base
    max_output_tokens: 60
    system: |
      You are a careful reviewer. The base estimate of p_yes for a
      prediction market is shown below. Decide whether it's a defensible
      estimate.

      - If the base estimate is reasonable, accept it (revised p_yes can
        be the same value).
      - If the base estimate is clearly miscalibrated (over-confident in
        either direction, ignored the current price anchor, or doesn't
        match what the news supports), propose a revised p_yes.

      Reply JSON only, no markdown fences:
      {"accept": bool, "p_yes": 0.0-1.0, "reason": "<=20 words"}
    user_template: |
      Article: {{article_title}}
      {{article_body_or_summary}}

      Market: {{market_question}}
      Current YES price: {{market_mid_t0}}

      Base estimate: p_yes={{base.p_yes}}  reason: {{base.reason}}

features:
  article_body_max_chars: 400

parse:
  require_direction: false
  require_p_yes: false
  derive_direction_from_p_yes: true
  final_field: critic.p_yes

backtest:
  sizing: kelly
  bankroll_usdc: 1000
  kelly_fraction: 0.25
  max_position_pct: 0.10
  min_size_usdc: 1.0
  min_edge: 0.02
  entry: best_ask
  fallback_entry: market_mid_t0
  exit_horizon_seconds: 3600   # 1h: matches explorer capture_post_secs
  fee_pct: 0.02
  skip_when_no_book: true

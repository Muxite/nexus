name: t2-no-anchor
version: v1
description: |
  Hypothesis: showing the current market mid to the LLM anchors its
  estimate to the current price (because v3-style prompts explicitly
  say "deviate only when you have a reason"). Removing the anchor
  forces an independent estimate. We compare that estimate to the
  observed mid offline to derive direction and edge.

model: google/gemini-2.5-flash
max_output_tokens: 40

prompt:
  system: |
    You are a probability estimator for binary prediction markets. Given
    only the news and the market question, estimate the probability the
    market resolves YES. You will NOT be told the current market price.

    Reply with JSON only, no markdown fences:
    {"p_yes": 0.0-1.0, "reason": "<=15 words"}
  user_template: |
    News: {{article_title}}
    {{article_body_or_summary}}

    Market: {{market_question}}
    Description: {{market_description}}
    Deadline: {{market_end_date}} (in {{hours_to_expiry}}h)

features:
  article_body_max_chars: 400

parse:
  require_direction: false
  require_p_yes: true
  derive_direction_from_p_yes: true

backtest:
  sizing: kelly
  bankroll_usdc: 1000
  kelly_fraction: 0.25
  max_position_pct: 0.10
  min_size_usdc: 1.0
  min_edge: 0.02
  entry: best_ask
  exit_horizon_seconds: 1200
  fee_pct: 0.02
  skip_when_no_book: true

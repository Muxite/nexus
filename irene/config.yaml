# Irene config — copy to config.yaml and fill in your keys.
# This file is re-read every 20 seconds. Changes take effect on the next cycle.
# See docs/config_schema.md for full documentation.

irene:
  mode: paper        # Start in paper mode. Change to "live" only after validation.
  drawdown_limit: 0.10

polymarket:
  clob_url: "https://clob.polymarket.com"
  gamma_url: "https://gamma-api.polymarket.com"
  # Live mode only — leave blank for paper trading:
  private_key: ""
  api_key: ""
  api_secret: ""
  api_passphrase: ""
  chain_id: 137      # 137 = Polygon mainnet

trading:
  balance_usdc: 100.0
  max_position_fraction: 0.20
  kelly_fraction: 0.25          # full aggression, we want real signal on good/bad
  min_edge: 0.02                # very low bar → take almost everything
  fee_buffer: 0.01
  max_liquidity_fraction: 0.30  # allow deep fills
  max_open_positions: 64
  order_type: "FOK"
  position_timeout_hours: 120   # 5-day test window
  edge_increment_yes: 0.12
  edge_increment_no: 0.12

markets:
  min_volume_usdc: 1000         # low floor — volume filter is less important than coverage
  max_hours_to_close: 2160      # 90 days — Polymarket markets resolve weeks/months out
  min_hours_to_close: 1
  exclude_keywords:
    - "nfl"
    - "nba"
    - "mlb"
    - "nhl"
    - "premier league"
    - "champions league"
    - "laliga"
    - "bundesliga"
    - "world cup"
    - "super bowl"
    - "stanley cup"
    - "march madness"

signals:
  newsapi_key: ""
  newsapi_keys: []              # populated via IRENE__SIGNALS__NEWSAPI_KEYS in .env
  newsapi_poll_seconds: 480     # 2 keys × 90/day = 180 req → 1 per 480s fits comfortably
  newsapi_page_size: 100
  brave_api_key: ""
  brave_api_keys: []            # populated via IRENE__SIGNALS__BRAVE_API_KEYS in .env
  brave_poll_seconds: 300       # 1 key × 500/day → 1 per 173s min; 300s = ~288/day (safe)
  rss_feeds:
    - url: "https://www.theguardian.com/world/rss"
    - url: "https://feeds.bbci.co.uk/news/rss.xml"
    - url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    - url: "https://www.aljazeera.com/xml/rss/all.xml"
    - url: "https://rss.politico.com/politics-news.xml"
    - url: "https://feeds.npr.org/1001/rss.xml"
    - url: "https://www.pbs.org/newshour/feeds/rss/world"
    - url: "https://www.ft.com/?format=rss"
    - url: "https://rss.dw.com/rdf/rss-en-all"
  rss_poll_seconds: 30          # faster polling (still well within 3000/day budget)
  watched_pages:
    # Persistent browser tabs — MutationObserver fires on new DOM nodes.
    # reload_seconds: force full reload after this silence window (±jitter_fraction).
    # max_failures: mark unreachable after N consecutive errors → 30min cooldown.
    - url: "https://apnews.com/"
      reload_seconds: 240
      jitter_fraction: 0.20
      change_wait_seconds: 20
      max_failures: 5
    - url: "https://www.politico.com/"
      reload_seconds: 300
      jitter_fraction: 0.20
      change_wait_seconds: 30
      max_failures: 5
    - url: "https://www.bbc.com/news/world"
      reload_seconds: 180
      jitter_fraction: 0.15
      change_wait_seconds: 20
      max_failures: 5
    - url: "https://www.reuters.com/"
      reload_seconds: 240
      jitter_fraction: 0.20
      change_wait_seconds: 25
      max_failures: 5
    - url: "https://www.aljazeera.com/news/"
      reload_seconds: 300
      jitter_fraction: 0.20
      change_wait_seconds: 30
      max_failures: 5
    - url: "https://www.theguardian.com/world"
      reload_seconds: 270
      jitter_fraction: 0.20
      change_wait_seconds: 25
      max_failures: 5
    - url: "https://edition.cnn.com/world"
      reload_seconds: 240
      jitter_fraction: 0.20
      change_wait_seconds: 20
      max_failures: 5
    - url: "https://www.axios.com/"
      reload_seconds: 300
      jitter_fraction: 0.20
      change_wait_seconds: 25
      max_failures: 5
    # Truth Social — post_mode extracts status text instead of article links.
    # Trump's feed is a direct predictor for policy/tariff/geopolitics markets.
    - url: "https://truthsocial.com/@realDonaldTrump"
      reload_seconds: 120
      jitter_fraction: 0.15
      change_wait_seconds: 15
      post_mode: true
      max_failures: 3
  similarity_threshold: 0.35    # news↔market cosine typically 0.35–0.55; 0.65 was too strict
  top_k_markets: 10             # map each signal to top 10 markets
  max_signal_age_seconds: 300   # accept signals up to 5 min old
  direction_min_confidence: 0.45  # higher bar with AI classifier (was 0.25 for keywords)
  use_llm_direction: true       # use Claude Haiku for per-market direction classification
  jitter_fraction: 0.15
  rss_startup_spread_fraction: 0.5  # faster stagger at boot

scanner:
  poll_interval_seconds: 90     # refresh market index more frequently
  embedding_rebuild_interval_seconds: 300   # 5 min — catch up on newly-expanded market set
  gamma_page_size: 200
  gamma_max_pages: 20
  jitter_fraction: 0.20      # ±20% on poll interval

timing:
  jitter_fraction: 0.20      # global default; section-level overrides take precedence
  profile_window: 200        # samples retained per operation in the in-memory profiler
  publish_interval_seconds: 60  # how often to push profiler summary to Redis (0=off)

monitor:
  port: 8080
  per_market_log_days: 30
  signals_export_dir: "/data/exports"
  signals_export_interval_seconds: 300
  signals_export_limit: 5000
  dashboard_text_path: "/data/exports/dashboard.txt"
  dashboard_text_interval_seconds: 10

llm:
  provider: "google"
  api_key: ""                   # set via IRENE__LLM__API_KEY in .env (Gemini API key)
  model: "gemini-2.5-flash"     # gemini-2.5-flash recommended; disable_thinking=true for speed

database:
  url: "postgresql://irene:irene@postgres:5432/irene"
  pool_size: 5

redis:
  url: "redis://redis:6379/0"
  signal_channel: "irene:signals"
  heartbeat_channel: "irene:heartbeat"

rate_limits:
  newsapi_max_per_day: 90
  brave_max_per_day: 500   # paid Brave plan — tune from dashboard
  rss_http_max_per_day: 3000
  clob_max_per_day: 20000

# irene config — P3 chunk 3 onwards.
#
# Env overlay: IRENE__SECTION__KEY=value overrides any field below
# (e.g. IRENE__TRADE__BALANCE_USDC=2000). See app/config.py.

irene:
  cycle: chunk3-soak-1
  log_level: INFO

db:
  path: /data/irene.db

scraper:
  # Cycle 4: switched from v1 (scraper:9000) to v2 (jennie-scraper-v2:9001).
  # v2 keeps /feed shape-compatible and adds /scrape for HTML headline
  # extraction with trafilatura boilerplate stripping.
  url: http://jennie-scraper-v2:9001
  timeout_seconds: 12

openrouter:
  # api_key comes from .env (OPENROUTER_API_KEY) — never commit secrets.
  direction_model: google/gemini-2.5-flash

budget:
  monthly_cap_usd: 50.0
  pause_at_remaining_usd: 2.0
  poll_seconds: 60

ingest:
  # Hand-validated against scraper:9000 on 2026-05-24. v2 /feed accepts
  # the same shape so this list is unchanged.
  feeds:
    # Existing (seulgi mirror)
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://www.timesofisrael.com/feed/
    - https://www.thehindu.com/news/feeder/default.rss
    # Broad-coverage majors
    - http://feeds.bbci.co.uk/news/rss.xml
    - https://www.theguardian.com/world/rss
    - https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    - https://feeds.washingtonpost.com/rss/world  # may 404; scraper logs handle
    - https://api.axios.com/feed/
    - https://www.ft.com/world?format=rss
    - https://feeds.npr.org/1001/rss.xml
    - https://feeds.skynews.com/feeds/rss/world.xml
    - https://www.cbsnews.com/latest/rss/world
    - https://abcnews.go.com/abcnews/internationalheadlines
    # Business / markets
    - https://www.cnbc.com/id/100727362/device/rss/rss.html
    - https://feeds.bloomberg.com/politics/news.rss
    - https://www.economist.com/the-world-this-week/rss.xml
    # Politics
    - https://feeds.feedburner.com/politico
  poll_seconds: 60

  # Cycle 4: HTML homepages — v2's /scrape mode=links returns the
  # boilerplate-stripped headline link-set. Polled every 5 min (v2
  # caches by fingerprint so this is cheap when nothing changed).
  # Cycle 5: most of these are now in `combined_sources` below, which
  # uses /scrape mode=combined to fetch RSS + HTML in parallel. The
  # html_sites entries that remain are sites WITHOUT a pinned RSS in
  # services/scraper-v2/config/per_host.yaml — there combined mode
  # would degenerate to html-only anyway.
  html_sites: []
  html_poll_seconds: 300

  # Cycle 5: combined RSS+HTML sources. Each entry is a homepage URL;
  # the scraper looks up the host's pinned `rss_url` in per_host.yaml,
  # fetches RSS + HTML in parallel, and returns the merged link set
  # (HTML breaking news + RSS summaries). enrich_html_top_n=3 asks the
  # scraper to fan out mode=article for up to 3 HTML-only links per
  # poll, attaching body-derived summaries — meaningful for the LLM.
  combined_sources:
    - https://apnews.com
    - https://www.reuters.com
    - https://www.bbc.com/news
    - https://www.theguardian.com/world
    - https://www.nytimes.com
    - https://www.washingtonpost.com
    - https://www.cnn.com
    - https://www.aljazeera.com
    - https://www.ft.com
    - https://www.wsj.com
    - https://www.politico.com
    - https://www.axios.com
    - https://thehill.com
    - https://www.bloomberg.com
    - https://www.cnbc.com
    - https://www.npr.org
  combined_poll_seconds: 180
  combined_enrich_html_top_n: 3

trade:
  balance_usdc: 1000.0

dkg_trade:
  # Chunk-3 dual-path trader. final_score >= 0.8 gives ~69% precision
  # per reports/2026-05-24-irene-link-backfill.md.
  enabled: true
  score_floor: 0.8

closer:
  # Hold positions for 24h then exit. Real Polymarket markets typically
  # resolve in days; this is the soak's safety net, not the primary exit.
  poll_seconds: 60
  timeout_hours: 24.0

impact:
  poll_seconds: 30
  max_age_hours: 2.0

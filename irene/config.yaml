# irene config — P3 chunk 3 onwards.
#
# Env overlay: IRENE__SECTION__KEY=value overrides any field below
# (e.g. IRENE__TRADE__BALANCE_USDC=2000). See app/config.py.

irene:
  cycle: chunk3-soak-1
  log_level: INFO

db:
  path: /data/irene.db

scraper:
  # Cycle 4: switched from v1 (scraper:9000) to v2 (jennie-scraper-v2:9001).
  # v2 keeps /feed shape-compatible and adds /scrape for HTML headline
  # extraction with trafilatura boilerplate stripping.
  url: http://jennie-scraper-v2:9001
  timeout_seconds: 12

openrouter:
  # api_key comes from .env (OPENROUTER_API_KEY) — never commit secrets.
  direction_model: google/gemini-2.5-flash

budget:
  monthly_cap_usd: 50.0
  pause_at_remaining_usd: 2.0
  poll_seconds: 60

ingest:
  # Standalone RSS feeds polled via /feed. Cycle 6a (2026-05-25): each
  # URL probed live; only feeds returning >= 10 items kept. Subsection
  # feeds significantly expand coverage beyond the front page per host.
  #
  # Cycle 24 (2026-05-26) noise-prune: 15 RSS feeds removed based on the
  # 24h signal-source audit (yield < 0.10 sig/article AND volume ≥ 15
  # articles in the audit window — small-sample exceptions kept). Removed
  # feeds + reasons in
  # `reports/2026-05-26-scraper-audit-and-parallel-work.md`. Net effect:
  # ~470 noise articles/day cut; 0 useful signal lost.
  feeds:
    # ── Tier-1 front pages (kept from cycle 4 baseline) ──
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://www.timesofisrael.com/feed/
    - https://www.thehindu.com/news/feeder/default.rss
    - http://feeds.bbci.co.uk/news/rss.xml
    - https://www.theguardian.com/world/rss
    - https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml
    - https://feeds.npr.org/1001/rss.xml
    - https://feeds.skynews.com/feeds/rss/world.xml
    - https://www.cbsnews.com/latest/rss/world
    - https://abcnews.go.com/abcnews/internationalheadlines
    - https://www.economist.com/the-world-this-week/rss.xml
    - https://feeds.feedburner.com/politico
    # ── BBC subsections ──
    - https://feeds.bbci.co.uk/news/business/rss.xml
    - https://feeds.bbci.co.uk/news/politics/rss.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
    - https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    # cycle-24 prune: bbci/health (48art 0.08yld), bbci/world/asia (17art 0.0yld)
    - https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml
    - https://feeds.bbci.co.uk/news/world/europe/rss.xml
    - https://feeds.bbci.co.uk/news/world/middle_east/rss.xml
    # ── NYT subsections ──
    - https://rss.nytimes.com/services/xml/rss/nyt/US.xml
    - https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    # cycle-24 prune: nyt/Business (30art 0.03yld), nyt/Science (low-vol 0.0yld kept defensively)
    - https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml
    - https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml
    - https://rss.nytimes.com/services/xml/rss/nyt/Science.xml
    # ── Guardian subsections ──
    - https://www.theguardian.com/us-news/rss
    # cycle-24 prune: guardian/politics (21art 0.09yld), /technology (23art 0.0yld), /environment (24art 0.0yld)
    - https://www.theguardian.com/business/rss
    # ── WSJ subsections (feeds.a.dj.com pattern still works) ──
    - https://feeds.a.dj.com/rss/RSSWorldNews.xml
    # cycle-24 prune: RSSWSJD (20art 0.0yld), RSSMarketsMain (20art 0.0yld). RSSOpinion left at 13art (small sample).
    - https://feeds.a.dj.com/rss/RSSOpinion.xml
    # ── Politico subsections ──
    # cycle-24 prune: /congress (28art 0.07yld), /whitehouse (26art 0.04yld). /defense (28art 2.0yld) kept.
    - https://rss.politico.com/defense.xml
    # ── The Hill subsections ──
    - https://thehill.com/feed/
    - https://thehill.com/homenews/senate/feed/
    - https://thehill.com/homenews/house/feed/
    - https://thehill.com/homenews/administration/feed/
    # ── NPR subsections ──
    - https://feeds.npr.org/1006/rss.xml   # business
    - https://feeds.npr.org/1014/rss.xml   # politics
    - https://feeds.npr.org/1004/rss.xml   # world
    - https://feeds.npr.org/1019/rss.xml   # tech
    # ── Sky News subsections ──
    - https://feeds.skynews.com/feeds/rss/politics.xml
    - https://feeds.skynews.com/feeds/rss/business.xml
    - https://feeds.skynews.com/feeds/rss/technology.xml
    # ── CBS / ABC subsections ──
    - https://www.cbsnews.com/latest/rss/politics
    # cycle-24 prune: cbsnews/moneywatch (10art 0.0yld), abc/politicsheadlines (28art 0.0yld)
    - https://abcnews.go.com/abcnews/usheadlines
    # ── Tier-2 US opinion / specialty ──
    - https://www.motherjones.com/feed/
    - https://www.propublica.org/feeds/propublica/main
    # cycle-24 prune: theatlantic.com/feed/channel/politics/ (25art 0.0yld)
    - https://slate.com/feeds/news-and-politics.rss
    - https://www.realclearpolitics.com/index.xml
    # ── Tier-2 finance ──
    - http://feeds.marketwatch.com/marketwatch/topstories/
    - https://finance.yahoo.com/news/rssindex
    # ── Tier-2 tech ──
    - https://techcrunch.com/feed/
    - https://feeds.arstechnica.com/arstechnica/index
    - https://www.theverge.com/rss/index.xml
    - https://www.wired.com/feed/rss
    # ── Tier-2 international ──
    - https://indianexpress.com/feed/
    - https://timesofindia.indiatimes.com/rssfeedstopstories.cms
    - https://feeds.elpais.com/mrss-s/pages/ep/site/english.elpais.com/portada
    # cycle-24 prune: repubblica.it (combined showed 397art 0.02yld; RSS not separately tracked)
    # cycle-24 prune: rss.sueddeutsche.de (38art 0.08yld, German lang)
    - https://www.politico.eu/feed/
    # ── Tier-2 wire / specialty ──
    - https://rss.dw.com/rdf/rss-en-all
    - https://www.france24.com/en/rss
    - https://www.channelnewsasia.com/rssfeeds/8395986
  poll_seconds: 60

  # Cycle 4: HTML homepages — v2's /scrape mode=links returns the
  # boilerplate-stripped headline link-set. Polled every 5 min (v2
  # caches by fingerprint so this is cheap when nothing changed).
  # Cycle 5: most of these are now in `combined_sources` below, which
  # uses /scrape mode=combined to fetch RSS + HTML in parallel. The
  # html_sites entries that remain are sites WITHOUT a pinned RSS in
  # services/scraper-v2/config/per_host.yaml — there combined mode
  # would degenerate to html-only anyway.
  html_sites: []
  html_poll_seconds: 300

  # Cycle 5: combined RSS+HTML sources. Each entry is a homepage URL;
  # the scraper looks up the host's pinned `rss_url` in per_host.yaml,
  # fetches RSS + HTML in parallel, and returns the merged link set
  # (HTML breaking news + RSS summaries). enrich_html_top_n=3 asks the
  # scraper to fan out mode=article for up to 3 HTML-only links per
  # poll, attaching body-derived summaries — meaningful for the LLM.
  combined_sources:
    # Cycle 24 (2026-05-26) noise-prune: 4 combined sources removed where
    # ALL emitted variants (+html / +article+html / +rss) yielded < 0.10
    # sig/article in the 24h audit. See
    # `reports/2026-05-26-scraper-audit-and-parallel-work.md`. Sources
    # whose +article+html variant was productive (theguardian.com/world
    # at 0.78 yld) were KEPT even when +html alone was low — the entry
    # controls both variants.
    # ── Tier-1 wires (HTML + pinned RSS in per_host.yaml) ──
    - https://apnews.com
    - https://www.reuters.com
    - https://www.bbc.com/news
    - https://www.theguardian.com/world
    - https://www.nytimes.com
    - https://www.washingtonpost.com
    - https://www.cnn.com
    - https://www.aljazeera.com
    - https://www.ft.com
    - https://www.wsj.com
    - https://www.politico.com
    - https://www.axios.com
    - https://thehill.com
    - https://www.bloomberg.com
    - https://www.cnbc.com
    - https://www.npr.org
    # ── Tier-2 US opinion / specialty (HTML + RSS pin in per_host.yaml) ──
    - https://www.motherjones.com
    # cycle-24 prune: propublica.org (+html 22art 0.09yld, +rss 16art 0.0yld)
    - https://www.theatlantic.com
    - https://slate.com
    - https://www.realclearpolitics.com
    # ── Tier-2 finance ──
    - https://www.marketwatch.com
    - https://finance.yahoo.com
    # ── Tier-2 tech ──
    # cycle-24 prune: techcrunch.com (+html 25/0, +html+rss 19/0 — all 0.0 yld)
    - https://arstechnica.com
    # cycle-24 prune: theverge.com (+html 50/1=0.02, +html+rss 8/0=0.0)
    - https://www.wired.com
    # ── Tier-2 international ──
    - https://indianexpress.com
    - https://timesofindia.indiatimes.com
    - https://english.elpais.com
    # cycle-24 prune: repubblica.it (+html 397art 0.02yld — biggest single noise source)
    - https://www.sueddeutsche.de
    - https://www.politico.eu
    # ── Tier-2 wire / specialty ──
    - https://www.dw.com/en/top-stories/s-9097
    - https://www.france24.com/en/
    - https://www.channelnewsasia.com/
  combined_poll_seconds: 180
  combined_enrich_html_top_n: 3

trade:
  balance_usdc: 1000.0
  # Cycle 24 (2026-05-26) — RELAX FOR BACKTEST DATA YIELD.
  # The post-cycle-24 funnel is direction-gate dominated (78% NEUTRAL) with
  # market_news_imbalance (10%), mid_degenerate (4%), and edge_below_min (1%)
  # killing decisive YES/NO predictions downstream. F's near-miss panel shows
  # the LLM is making 0.75-0.95 confidence calls that get rejected on
  # microstructure floors. To populate scripts/replay/sweep.py with a rich
  # enough trade set to discriminate signal from noise, we deliberately let
  # marginal trades through here, then sweep thresholds upward in replay to
  # see which gates ACTUALLY filter losing trades vs which just cost yield.
  # If a metric (PnL, win-rate, sharpe) IMPROVES when a knob is raised in
  # backtest, that knob earns its keep; if not, it was just noise filtering.
  # Re-tighten the survivors after the sweep finishes.
  min_confidence: 0.45              # was 0.55 (Pydantic default)
  min_edge: 0.02                    # was 0.04
  min_market_volume_usdc: 2000.0    # was 10000 (unblocks "thin_market" floor)
  extreme_mid_low: 0.05             # was 0.15 (widens mid_degenerate band)
  extreme_mid_high: 0.95            # was 0.85

dkg_trade:
  # Chunk-3 dual-path trader. final_score >= 0.8 gives ~69% precision
  # per reports/2026-05-24-irene-link-backfill.md.
  #
  # Cycle 26 stage-1 soak fix #6: dropped to 0.5 for the collapsed
  # single-container data-collection mode. Wider gate → 3-5× more
  # candidate trades land in the `trades` table for backtest. The
  # direction-LLM and edge gates downstream still filter; the score
  # floor just admits borderline cases that 0.8 would silently discard.
  enabled: true
  score_floor: 0.5

# Cycle 26 stage-1 soak fix #6: explorer tail now runs in production
# mode too (one container). Defaults from ExplorerSection are already
# permissive — we set them explicitly here so this file documents the
# data-collection intent without surprising a future reader who expects
# explorer.yaml to be the only place these knobs appear.
explorer:
  score_floor: 0.5
  relatedness_model: google/gemini-2.5-flash
  relatedness_max_article_chars: 800
  relatedness_max_output_tokens: 80
  odds_poll_secs: 15
  capture_post_secs: 1200   # 20 min
  capture_pre_secs: 600     # 10 min

closer:
  # Hold positions for 24h then exit. Real Polymarket markets typically
  # resolve in days; this is the soak's safety net, not the primary exit.
  poll_seconds: 60
  timeout_hours: 24.0

impact:
  poll_seconds: 30
  # Cycle 11: raised to 24h so the +24h long-tail bucket
  # (BUCKETS_SECONDS=86400 in impact_tracker.py) has time to fire.
  max_age_hours: 24.0

markets:
  # Cycle 26 promotion — stage 1: events-endpoint dual-read shadow mode.
  # Fetch BOTH /events and /markets every poll, reconcile, write the
  # union, and log per-cycle counts as
  # `events= markets= both= only_events= only_markets=`.
  # Promote `events_endpoint_dual_read=false` (events-only) once
  # `only_markets / total < 1%` for ~3 days. WS feed stays OFF; the
  # probe + soak come later in the ledger.
  use_events_endpoint: true
  events_endpoint_dual_read: true
  enable_ws_feed: false

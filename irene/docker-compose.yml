# Standalone docker-compose for irene.
#
# Per the user decision 2026-05-22 ("Standalone only — no root compose
# edits ever") this file is the ONE WAY to start irene. The root
# jennie/docker-compose.yml is NEVER edited by irene PRs.
#
#   docker compose -f irene/docker-compose.yml up --build
#
# Prerequisites:
#   - The shared scraper must already be up on the `jennie_default` network
#     (root compose: `docker compose up scraper`). Irene only consumes it
#     over HTTP — it does not start or own that container.
#   - irene/config.yaml must exist (copy from config.example.yaml in a
#     later PR; not present yet — P1 doesn't read config beyond a stub).

services:
  irene:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irene
    restart: unless-stopped
    volumes:
      - ./data:/data
      # config.yaml is bind-mounted read-only so the hot-reload picks up
      # host edits without a container rebuild (pattern from old-irene).
      - ./config.yaml:/config/config.yaml:ro
      # Shared sentence-transformers cache so we don't re-download the
      # ~500MB model into a separate volume from seulgi.
      - irene_model_cache:/root/.cache/torch/sentence_transformers
    environment:
      - IRENE_CONFIG=/config/config.yaml
      # Cycle 4: default to scraper-v2 (port 9001). Override via env
      # if you want to point back at v1.
      - SCRAPER_URL=${SCRAPER_URL:-http://jennie-scraper-v2:9001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Per-cycle name. main.py calls db.ensure_current_cycle(name) on boot.
      - IRENE_CYCLE=${IRENE_CYCLE:-cycle-0}
    env_file:
      - path: ./.env
        required: false
    networks:
      - jennie_default
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  irene-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: irene-test
    volumes:
      - ./data:/data
    environment:
      - PYTHONPATH=/app
    networks:
      - jennie_default

volumes:
  irene_model_cache:

networks:
  jennie_default:
    external: true

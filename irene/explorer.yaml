# irene config — noisy-explorer mode (IRENE_MODE=explorer).
#
# Sister to `config.yaml` for the `irene-explorer` docker-compose service.
# Same DB, same scraper, same upstream ingest → match → link pipeline as
# production. The tail diverges: instead of trade/closer/impact_tracker
# we wire explorer + odds_capture. See
# `plans/plan-out-a-major-moonlit-kitten.md` for the design.
#
# Env overlay: IRENE__SECTION__KEY=value still works
# (e.g. IRENE__EXPLORER__SCORE_FLOOR=0.6).

irene:
  # IRENE_CYCLE env var overrides this on container boot (compose sets
  # IRENE_CYCLE=explorer-0 by default). Cycle partitioning is how we
  # keep explorer rows distinguishable from production trades.
  cycle: explorer-0
  log_level: INFO

db:
  # Shared with production. Explorer writes ONLY to `explorations` and
  # `odds_observations`; production tables (trades, decisions, wallet)
  # are read-only from this container's perspective.
  path: /data/irene.db

scraper:
  url: http://jennie-scraper-v2:9001
  timeout_seconds: 12

openrouter:
  direction_model: google/gemini-2.5-flash

budget:
  monthly_cap_usd: 50.0
  pause_at_remaining_usd: 2.0
  poll_seconds: 60


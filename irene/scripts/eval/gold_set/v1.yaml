version: v1
ontology_version: v1
created_at: 2026-05-23
purpose: |
  Held-out extraction QA. Each article carries the expected entities
  and facts the extractor SHOULD produce. extraction_quality.py runs
  the live extractor against each title+summary and reports precision/
  recall vs this expected set.

  Coverage targets (also enforced by tests/test_extraction_quality.py):
    - All 10 ontology v1 relations appear at least once
      (announces, decides, elects, acquires, launches, accuses,
       signs, changes, resigns, nominates).
    - At least 5 of the 7 entity types appear.
    - A mix of single-fact and multi-fact articles.

  Matching at the harness side is case-insensitive equality on
  (entity_type, canonical_name) and (subj, relation, obj). Keep entity
  names short and canonical — what the LLM would naturally emit.

articles:
  - id: gold-001
    title: "FDA rejects Pfizer's diabetes drug application"
    summary: |
      The U.S. Food and Drug Administration today announced it has rejected
      Pfizer Inc.'s application for its new diabetes drug, citing inadequate
      safety data from the company's late-stage clinical trial.
    expected_entities:
      - {type: ORG, name: "FDA"}
      - {type: COMPANY, name: "Pfizer"}
    expected_facts:
      - {subj: "FDA", relation: "announces", obj: "Pfizer"}
      - {subj: "FDA", relation: "decides", obj: "Pfizer"}

